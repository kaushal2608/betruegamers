<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal / Shield Gaming Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="2.5"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="rgba(112, 0, 255, 0.4)" stroke-width="1.2"/>

  <!-- Controller Body -->
  <path d="M16 26 C16 21 22 18 32 18 C42 18 48 21 48 26 C48 33 46 45 42 45 C38 45 36 39 32 39 C28 39 26 45 22 45 C18 45 16 33 16 26 Z" 
        fill="url(#neonCyan)" 
        filter="url(#neonGlow)"/>

  <!-- Controller Inner Grip Insets -->
  <path d="M20 28 C20 25 24 23 32 23 C40 23 44 25 44 28 C44 33 43 39 40 39 C37 39 35 34 32 34 C29 34 27 39 24 39 C21 39 20 33 20 28 Z" 
        fill="#080c14"/>

  <!-- D-Pad (Left) -->
  <path d="M24 28 H26 V26 H28 V28 H30 V30 H28 V32 H26 V30 H24 Z" fill="#00f0ff"/>

  <!-- Action Buttons (Right) -->
  <circle cx="39" cy="27" r="1.3" fill="#00f0ff"/>
  <circle cx="37" cy="29" r="1.3" fill="#ec4899"/>
  <circle cx="41" cy="29" r="1.3" fill="#3b82f6"/>
  <circle cx="39" cy="31" r="1.3" fill="#10b981"/>

  <!-- Center Gaming Accent / Logo Notch -->
  <polygon points="32,25 34,28 30,28" fill="#00f0ff"/>
</svg>
